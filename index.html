<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BLE-Oto</title>
  <style>
    :root {
      --bg: #0a0c0f; --card: #10151b; --card2: #151c25; --border: #1e2d3d;
      --accent: #00d4ff; --ok: #00ff88; --warn: #ffb300; --err: #ff4757;
      --text: #c8d8e8; --dim: #6a8090;
      --mono: ui-monospace, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); }
    #app { max-width: 560px; margin: 0 auto; padding: max(8px, env(safe-area-inset-top)) 8px 16px; display: flex; flex-direction: column; gap: 8px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
    .card h2 { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1 1 0; min-width: 0; }

    button { font: 700 1rem var(--sans); min-height: 44px; padding: 0 12px; color: var(--text); background: var(--card2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button.ok { color: var(--ok); border-color: var(--ok); }
    button.warn { color: var(--warn); border-color: var(--warn); }
    button.big { min-height: 84px; font-size: 1.3rem; }

    input { min-height: 44px; padding: 0 10px; font: 1rem var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; outline: none; width: 100%; }
    input:focus { border-color: var(--accent); }

    /* nhật ký */
    #logCard { padding: 0; gap: 0; overflow: hidden; height: 32dvh; }
    .log-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--card2); border-bottom: 1px solid var(--border); }
    .log-head button { min-height: 32px; font-size: .85rem; }
    #logContent { flex: 1; overflow-y: auto; padding: 8px 10px; font: .8rem/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
    #logContent .t { color: var(--dim); } #logContent .sys { color: var(--dim); }
    #logContent .tx { color: var(--accent); } #logContent .rx { color: var(--ok); } #logContent .err { color: var(--err); }

    /* kết nối */
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 700; text-transform: uppercase; font-size: .9rem; color: var(--err); }
    .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
    .status.on { color: var(--ok); }

    #state { text-align: center; font-weight: 700; font-size: 1.1rem; min-height: 1.4em; }
    #state.ok { color: var(--ok); } #state.err { color: var(--err); }
    #guestInfo { text-align: center; font-weight: 700; color: var(--warn); }
    details summary { cursor: pointer; color: var(--dim); font-size: .85rem; }

    /* QR */
    #qrBox { background: #fff; border-radius: 8px; padding: 6px; width: min(260px, 100%); align-self: center; }
    #qrBox svg { display: block; width: 100%; height: auto; }
    #qrCap { text-align: center; font-weight: 700; color: var(--accent); }
  </style>
</head>

<body>
  <div id="app">

    <!-- NHẬT KÝ -->
    <section class="card" id="logCard">
      <div class="log-head">
        <h2>Nhật ký</h2>
        <div class="row">
          <button id="btnClearLog">🗑 Xóa</button>
        </div>
      </div>
      <div id="logContent"></div>
    </section>

    <!-- KẾT NỐI -->
    <header>
      <div id="statusBar" class="status">Chưa kết nối</div>
      <button id="btnConnect" class="warn">🔗 Kết nối</button>
    </header>

    <!-- ĐIỀU KHIỂN XE -->
    <section class="card">
      <h2>Điều khiển xe</h2>
      <div id="state"></div>
      <div id="guestInfo"></div>
      <div class="row">
        <button id="btnUnlock" class="big ok needs-conn">🔓 Mở khóa</button>
        <button id="btnLock" class="big warn needs-conn">🔒 Khóa</button>
      </div>
      
    </section>

    <!-- MẬT KHẨU CHỦ XE (máy chưa lưu admin) -->
    <section class="card" id="secPwUnlock">
      <h2>Mở khóa bằng mật khẩu chủ xe</h2>
      <input id="pwInput" type="password" placeholder="Mật khẩu chủ xe" autocomplete="off" />
      <button id="btnPwUnlock" class="ok needs-conn">🔑 Mở khóa bằng mật khẩu</button>
    </section>

    <!-- LƯU TÀI KHOẢN ADMIN (máy chưa lưu admin) -->
    <section class="card" id="secSaveAdmin">
      <h2>Lưu tài khoản admin</h2>
      <button id="btnSaveAdmin" class="ok needs-conn">💾 Lưu tài khoản admin</button>
    </section>

    <!-- CẤP MÃ CHO ĐIỆN THOẠI LẠ (máy đã lưu admin) -->
    <section class="card" id="secInvite" style="display:none">
      <h2>Cấp mã cho điện thoại lạ</h2>
      <div class="row">
        <input id="guestUses" type="number" inputmode="numeric" min="1" max="20" value="1" />
        <button id="btnGuest" class="ok needs-conn" style="flex:2 1 0">🎟 Tạo mã (số lượt mở)</button>
      </div>
      <div id="guestOut" class="card" style="display:none">
        <div id="qrBox"></div>
        <div id="qrCap"></div>
        <div class="row">
          <button id="btnShare">📤 Chia sẻ</button>
          <button id="btnCopy">📋 Sao chép</button>
        </div>
      </div>
    </section>

    <!-- ĐẶT MẬT KHẨU CHỦ XE (máy đã lưu admin) -->
    <section class="card" id="secPw" style="display:none">
      <h2>Mật khẩu chủ xe</h2>
      <input id="pwNew" type="password" placeholder="Đặt mật khẩu (từ 10 ký tự)" autocomplete="new-password" />
      <button id="btnSetPw" class="ok needs-conn">🔐 Đặt / đổi mật khẩu</button>
    </section>

    <!-- XÓA TÀI KHOẢN ADMIN (máy đã lưu admin) -->
    <section class="card" id="secLogout" style="display:none">
      <h2>Tài khoản admin trên máy này</h2>
      <button id="btnLogout" class="warn">🚪 Xóa tài khoản admin</button>
    </section>

  </div>

  <script>
/* qrcode-generator 2.0.4 (MIT) - Kazuhiko Arase */
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

    const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
    const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { } };
    const norm = v => { const [a, k] = v.split(':'); return a + ':' + k.toLowerCase(); };

    function readAcc(k) {
      const v = lsGet(k);
      if (!CODE_RE.test(v)) return null;
      const [id, key] = v.split(':');
      return { id, key: unhex(key) };
    }
    const getAdmin = () => readAcc(K_ADMIN);
    const getGuest = () => readAcc(K_GUEST);

    function pickAcc() {
      if (tempAcc) return { ...tempAcc, kind: 'pw' };
      const a = getAdmin(); if (a) return { ...a, kind: 'admin' };
      const g = getGuest(); if (g) return { ...g, kind: 'guest' };
      return null;
    }

    function updateUI() {
      const admin = !!getAdmin();
      const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
      show('secPwUnlock', !admin);
      show('secSaveAdmin', !admin);
      show('secInvite', admin);
      show('secPw', admin);
      show('secLogout', admin);
    }

    // Tạo admin trên ESP32 (phải giữ BOOT) rồi lưu khóa vào máy này khi ESP32 xác nhận
    $('btnSaveAdmin').onclick = async () => {
      if (!isConn()) return;
      if (!confirm('Đã giữ nút BOOT trên ESP32 chưa? Điện thoại này sẽ trở thành admin (thay admin cũ nếu có).')) return;
      const key = crypto.getRandomValues(new Uint8Array(32));
      pendingAcc = 'admin:' + hex(key);
      await send('setup admin ' + hex(key));
    };

    $('btnLogout').onclick = () => {
      if (!confirm('Xóa tài khoản admin trên điện thoại này?')) return;
      lsDel(K_ADMIN);
      tempAcc = null; curRole = null; lastLink = '';
      $('guestOut').style.display = 'none';
      $('qrBox').replaceChildren();
      updateUI(); showState('', '');
      addLog('Đã xóa tài khoản admin khỏi máy này');
    };

    /* ============ BLE ============ */
    const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const WR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NT = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let device = null, wrChar = null, ntChar = null, rxBuf = '';
    let nonce = null, busy = false;
    let pendingAcc = null, pendingGuest = null, lastLink = '';

    const statusBar = $('statusBar');
    const btnConnect = $('btnConnect');
    const isConn = () => !!(device && device.gatt.connected && wrChar);

    function refreshUI() {
      const c = isConn();
      statusBar.textContent = c ? 'Đã kết nối' : 'Chưa kết nối';
      statusBar.className = 'status' + (c ? ' on' : '');
      btnConnect.textContent = c ? '🔌 Ngắt' : '🔗 Kết nối';
      btnConnect.className = c ? 'ok' : 'warn';
      document.querySelectorAll('.needs-conn').forEach(b => b.disabled = !c || busy);
    }

    async function send(text) {
      addLog('→ ' + (text.length > 60 ? text.slice(0, 40) + '…' : text), 'tx');
      await wrChar.writeValue(enc.encode(text + '\n'));
    }

    async function connectBLE() {
      if (!navigator.bluetooth) { addLog('Trình duyệt không hỗ trợ Web Bluetooth (dùng Chrome/Edge, trang phải chạy HTTPS).', 'err'); return; }
      try {
        device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'BLE' }], optionalServices: [SVC] });
        device.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await device.gatt.connect();
        const svc = await server.getPrimaryService(SVC);
        wrChar = await svc.getCharacteristic(WR);
        ntChar = await svc.getCharacteristic(NT);
        await ntChar.startNotifications();
        ntChar.addEventListener('characteristicvaluechanged', onNotify);
        nonce = null;
        refreshUI();
        addLog('✓ Đã kết nối ' + device.name, 'rx');
        await send('hello');
        if (pickAcc()) sendCmd(async () => 'status');     // lấy vai trò và số lượt còn lại
      } catch (e) {
        addLog(e.name === 'NotFoundError' ? 'Đã hủy chọn thiết bị' : '✗ Lỗi: ' + e.message, e.name === 'NotFoundError' ? 'sys' : 'err');
        refreshUI();
      }
    }

    function onDisconnected() {
      addLog('Thiết bị đã ngắt kết nối');
      wrChar = ntChar = null; rxBuf = ''; nonce = null; busy = false; tempAcc = null;
      refreshUI();
    }

    btnConnect.onclick = () => isConn() ? device.gatt.disconnect() : connectBLE();

    function onNotify(ev) {
      rxBuf += new TextDecoder().decode(ev.target.value);
      let i;
      while ((i = rxBuf.indexOf('\n')) >= 0) {
        const line = rxBuf.slice(0, i).replace(/\r$/, '').trim();
        rxBuf = rxBuf.slice(i + 1);
        if (line) handleLine(line);
      }
    }

    function handleLine(line) {
      if (line.startsWith('chal ')) { nonce = line.slice(5).trim(); return; }   // không ghi log
      const isErr = line.startsWith('err');
      addLog('ESP32: ' + line, isErr ? 'err' : 'rx');

      if (line.startsWith('ok unlocked')) {
        showState('🔓 Xe đã mở khóa', 'ok');
        const u = line.match(/uses=(\d+)/);
        setGuestInfo(u ? u[1] : undefined);
      } else if (line.startsWith('ok locked')) {
        showState('🔒 Xe đã khóa', 'ok');
      } else if (line.startsWith('ok role=')) {
        const m = line.match(/role=(\d) state=(\w+)(?: uses=(\d+))?/);
        if (m) {
          curRole = Number(m[1]);
          setGuestInfo(m[3]);
          showState((m[2] === 'locked' ? '🔒 Đang khóa' : '🔓 Đang mở') +
            ({ 0: ' · máy quen', 1: ' · admin', 2: ' · khách', 3: ' · chủ xe (mật khẩu)' }[m[1]] || ''), 'ok');
        }
      } else if (line === 'ok pw-set') {
        showState('🔐 Đã đặt mật khẩu chủ xe', 'ok');
      } else if (line === 'ok guest-added' && pendingGuest) {
        showGuestQr(pendingGuest); pendingGuest = null;
      } else if (line === 'ok admin-set' && pendingAcc) {
        lsSet(K_ADMIN, pendingAcc); pendingAcc = null;
        tempAcc = null; curRole = null;
        updateUI();
        showState('💾 Đã lưu tài khoản admin', 'ok');
        setTimeout(() => sendCmd(async () => 'status'), 300);    // lấy vai trò
      } else if (isErr) {
        const kind = lastKind;
        if (line === 'err hold-BOOT' || line === 'err args') pendingAcc = null;
        if (line === 'err auth') {
          if (kind === 'pw') tempAcc = null;                     // cho nhập lại mật khẩu
          if (kind === 'guest') { lsDel(K_GUEST); setGuestInfo(); }
        }
        if (line === 'err no-uses') { lsDel(K_GUEST); setGuestInfo(0); }
        const msg = {
          'err locked': '⛔ Bị khóa tạm do nhập sai nhiều lần',
          'err auth': kind === 'guest' ? '✖ Mã khách không còn hiệu lực' : kind === 'pw' ? '✖ Sai mật khẩu' : '✖ Tài khoản không hợp lệ',
          'err no-uses': '⛔ Mã khách đã hết lượt',
          'err perm': '✖ Không có quyền này',
          'err hold-BOOT': '✖ Chưa giữ nút BOOT trên ESP32'
        }[line] || '✖ ' + line;
        showState(msg, 'err');
      }
    }

    /* ---- gửi lệnh có ký HMAC ---- */
    async function sendCmd(build) {
      const acc = pickAcc();
      if (!acc) { addLog('Chưa có tài khoản', 'err'); return; }
      if (!isConn() || busy) return;
      busy = true; refreshUI();
      lastKind = acc.kind;
      try {
        for (let i = 0; i < 60 && !nonce; i++) await sleep(50);
        if (!nonce) { await send('hello'); for (let i = 0; i < 60 && !nonce; i++) await sleep(50); }
        if (!nonce) throw new Error('không nhận được nonce');
        const n = nonce; nonce = null;                      // mỗi nonce chỉ dùng 1 lần
        const text = await build(n, acc);
        const mac = hex(await hmac(acc.key, n + ':' + text)).slice(0, 32);
        await send(`${acc.id} ${mac} ${text}`);
      } catch (e) {
        addLog('Lỗi gửi lệnh: ' + e.message, 'err');
      } finally {
        busy = false; refreshUI();
      }
    }

    /* ============ NÚT BẤM ============ */
    $('btnUnlock').onclick = () => sendCmd(async () => 'unlock');
    $('btnLock').onclick = () => sendCmd(async () => 'lock');

    /* ---- mật khẩu chủ xe ---- */
    $('btnPwUnlock').onclick = async () => {
      const pw = $('pwInput').value;
      if (!pw) { addLog('Chưa nhập mật khẩu', 'err'); return; }
      addLog('Đang xử lý mật khẩu...');
      tempAcc = { id: 'owner', key: await pwKey(pw) };
      $('pwInput').value = '';
      sendCmd(async () => 'unlock');
    };

    $('btnSetPw').onclick = async () => {
      const pw = $('pwNew').value;
      if (pw.length < 10) { addLog('Mật khẩu cần ít nhất 10 ký tự', 'err'); return; }
      addLog('Đang xử lý mật khẩu...');
      const k = await pwKey(pw);
      $('pwNew').value = '';
      sendCmd(async (n, acc) => {
        const pad = await hmac(acc.key, n + ':pad');
        return 'setpw ' + hex(k.map((v, i) => v ^ pad[i]));   // khóa không đi trần qua BLE
      });
    };

    /* ---- cấp mã cho điện thoại lạ + QR ---- */
    function renderQr(text) {
      const qr = qrcode(0, 'L');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), q = 4, size = n + q * 2;
      let d = '';
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++)
          if (qr.isDark(r, c)) d += `M${c + q} ${r + q}h1v1h-1z`;
      $('qrBox').innerHTML =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">` +
        `<rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    }

    function showGuestQr(g) {
      lastLink = location.href.split('#')[0] + '#g=' + g.code;
      try { renderQr(lastLink); } catch (e) { addLog('Không tạo được QR: ' + e.message, 'err'); return; }
      $('qrCap').textContent = '🎟 ' + g.uses + ' lượt mở khóa';
      $('guestOut').style.display = '';
      addLog('Đã tạo mã khách – ' + g.uses + ' lượt', 'rx');
    }

    $('btnGuest').onclick = () => {
      const n = Math.min(20, Math.max(1, parseInt($('guestUses').value, 10) || 1));
      const gid = 'g' + hex(crypto.getRandomValues(new Uint8Array(3)));
      sendCmd(async (nn, acc) => {
        const pad = await hmac(acc.key, nn + ':pad');
        const k = crypto.getRandomValues(new Uint8Array(32));
        pendingGuest = { code: gid + ':' + hex(k), uses: n };
        return `guest ${gid} ${n} ${hex(k.map((v, i) => v ^ pad[i]))}`;   // khóa không đi trần qua BLE
      });
    };

    $('btnShare').onclick = async () => {
      if (!lastLink) return;
      try {
        if (navigator.share) await navigator.share({ title: 'Mở khóa xe', url: lastLink });
        else { await navigator.clipboard.writeText(lastLink); addLog('Đã sao chép đường dẫn'); }
      } catch (e) { }
    };
    $('btnCopy').onclick = async () => {
      if (!lastLink) return;
      try { await navigator.clipboard.writeText(lastLink); addLog('Đã sao chép đường dẫn'); }
      catch (e) { addLog('Không sao chép được', 'err'); }
    };

    /* ============ KHỞI ĐỘNG ============ */
    window.addEventListener('load', () => {
      addLog('Sẵn sàng');
      // Mã khách từ QR/đường dẫn: #g=<id>:<khóa>
      const m = location.hash.match(/^#g=([A-Za-z0-9_]{1,11}:[0-9a-fA-F]{64})$/);
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);   // xóa mã khỏi thanh địa chỉ
      if (m) {
        if (getAdmin()) addLog('Máy này đã có tài khoản admin, bỏ qua mã khách', 'err');
        else if (!getGuest() || confirm('Thay mã khách hiện tại bằng mã mới?')) {
          lsSet(K_GUEST, norm(m[1]));
          addLog('Đã nhận mã khách', 'rx');
        }
      }
      updateUI();
      refreshUI();
    });



    // Thay thế URL bên dưới bằng URL Web App bạn vừa copy ở Bước 1
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUl3ccNuzdlAeDpWec67eogBgbdWmwtpYn7iRhCdx--l__qoJCPM2HFZGBUIY5rk6N/exec";

  function trackVisit() {
    // Chống đếm trùng lặp liên tục trong cùng một phiên duyệt web (tùy chọn)
    // Nếu muốn đếm mỗi lần F5 là 1 lượt thì bỏ qua đoạn session Storage này
    if (sessionStorage.getItem("counted")) return;
    sessionStorage.setItem("counted", "true");

    const data = {
      page: window.location.pathname,
      userAgent: navigator.userAgent
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Cần thiết khi gọi Apps Script từ tên miền khác (GitHub Pages)
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    }).catch(error => console.error("Tracking error:", error));
  }

  // Chạy khi trang đã tải xong
  window.addEventListener("DOMContentLoaded", trackVisit);
  </script>
</body>
